name: Job&Talent
description: 'Job&Talent is an AI-powered workforce marketplace and workforce-management platform that
  connects companies with temporary and hourly workers across essential industries such as logistics,
  warehousing, delivery, manufacturing, retail, and construction. Founded in Spain and operating across
  roughly ten markets, the company placed around 300,000 people in work in 2024 and reported approximately
  EUR 1.9 billion in annual revenue. Its products include the flagship worker job-matching app, Job&Talent
  Business for employers to hire and manage staff (recruitment, scheduling, attendance, performance, and
  retention), and a growing suite of AI agents (including Clara for recruiting) that automate staffing
  operations. Job&Talent is backed by investors including the SoftBank Vision Fund. No public developer
  API or developer portal is published at this time; this profile captures the company identity plus its
  public security and trust surface.'
